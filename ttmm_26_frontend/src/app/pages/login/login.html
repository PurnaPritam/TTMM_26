<div class="container d-flex align-items-center justify-content-center vh-100">
  <div class="card login-card shadow-lg p-4" style="max-width: 400px; width: 100%; border-radius: 1rem;">
      <div class="text-center mb-4">
          <h3 class="fw-bold">Welcome Back</h3>
          <p class="text-muted">Please sign in to continue</p>
      </div>
      
      <div *ngIf="errorMsg" class="alert alert-danger">{{ errorMsg }}</div>

      <div>
          <div class="mb-3">
              <label class="form-label">Username</label>
              <input [(ngModel)]="username" type="text" class="form-control form-control-lg" placeholder="Username">
          </div>
          <div class="mb-3">
              <label class="form-label">Password</label>
              <input [(ngModel)]="password" type="password" class="form-control form-control-lg" placeholder="Password">
          </div>
          <div class="d-grid mt-4">
              <button (click)="onLogin()" class="btn btn-primary btn-lg">Sign In</button>
          </div>
      </div>
      <div class="text-center mt-3">
          <a routerLink="/home" class="text-decoration-none text-muted">Back to Public Board</a>
      </div>
  </div>
</div>
